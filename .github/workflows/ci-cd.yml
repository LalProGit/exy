name: CI/CD

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert repository owner to lowercase
        id: repo_owner
        run: echo "owner=${OWNER,,}" >> $GITHUB_OUTPUT
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Build and push exy-api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.main
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/exy-api:latest
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/exy-api:sha-${{ github.sha }}
          cache-from: type=gha,scope=exy-api
          cache-to: type=gha,scope=exy-api,mode=max

      - name: Build and push exy-discord-adapter
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.adapter
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/exy-discord-adapter:latest
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/exy-discord-adapter:sha-${{ github.sha }}
          cache-from: type=gha,scope=exy-adapter
          cache-to: type=gha,scope=exy-adapter,mode=max

  deploy-to-vps:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Convert repository owner to lowercase
        id: repo_owner
        run: echo "owner=${OWNER,,}" >> $GITHUB_OUTPUT
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Copy production compose to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          source: docker-compose.prod.yml
          target: /opt/exy-workspace/

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          script: |
            cd /opt/exy-workspace

            # Authenticate VPS with GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Inject runtime secrets and pull fresh images
            export REPO_OWNER=${{ steps.repo_owner.outputs.owner }}
            export OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
            export DISCORD_BOT_TOKEN=${{ secrets.DISCORD_BOT_TOKEN }}

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Wait for API healthcheck to pass (max 60s)
            echo "Waiting for API to become healthy..."
            for i in $(seq 1 12); do
              status=$(docker inspect --format='{{.State.Health.Status}}' exy-api 2>/dev/null || echo "starting")
              echo "  Attempt $i/12: $status"
              if [ "$status" = "healthy" ]; then
                echo "✅ API is healthy. Deploy succeeded."
                break
              fi
              if [ "$i" = "12" ]; then
                echo "❌ API failed to become healthy after 60s. Check logs:"
                docker logs --tail 50 exy-api
                exit 1
              fi
              sleep 5
            done

            # Clean up dangling images to preserve disk space
            docker image prune -f