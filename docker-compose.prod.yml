services:
  api:
    image: ghcr.io/${REPO_OWNER}/exy-api:latest
    container_name: exy-api
    ports:
      - "8000:8000"
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      PYTHONUNBUFFERED: "1"
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  discord-adapter:
    image: ghcr.io/${REPO_OWNER}/exy-discord-adapter:latest
    container_name: exy-discord-adapter
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      EXY_OS_WS_URL: ws://api:8000/api/ws
      PYTHONUNBUFFERED: "1"
    depends_on:
      api:
        condition: service_healthy
    restart: always

